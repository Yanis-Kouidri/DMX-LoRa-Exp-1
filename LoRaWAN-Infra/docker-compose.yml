services:
  chirpstack:
    image: chirpstack/chirpstack:4.19.2
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
      - ./configuration/certs:/etc/chirpstack-certs:ro
    depends_on:
      - postgres
      - mosquitto
      - redis
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_USER=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - CHIRPSTACK_API_SECRET=${CHIRPSTACK_API_SECRET:?CHIRPSTACK_API_SECRET must be set in .env}
    ports:
      - "127.0.0.1:8080:8080"

  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4.1.2
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-eu868.toml
    ports:
      - "3001:3001"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
      - ./configuration/certs:/etc/chirpstack-certs:ro
    depends_on:
      - mosquitto

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4.19.0
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - chirpstack

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata17:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB}

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes: 
      - ./configuration/mosquitto/config/:/mosquitto/config/
      - mosquittodata:/mosquitto/data

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddyfile
      - caddy_data:/data
      - caddy_config:/config
    command: caddy run --config /etc/caddyfile --adapter caddyfile
    networks:
      - default

  uplink-collector:
    build:
      context: ./uplink-collector
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPICS: application/+/device/+/event/+,+/gateway/+/+/+
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/lorawan_experiments
    depends_on:
      - mosquitto
      - postgres

  grafana:
    image: grafana/grafana-oss:11.6.5
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.chirpstack.kouidri.fr
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres

volumes:
  # PostgreSQL 17 data (migrated from PostgreSQL 14 with pg_dumpall on 2026-10-07).
  postgresqldata17:
  redisdata:
  mosquittodata:
  caddy_data:
  caddy_config:
  grafana_data:
